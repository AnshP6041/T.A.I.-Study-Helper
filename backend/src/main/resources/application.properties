spring.application.name=tai
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_REGION}
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.vision-model=claude-sonnet-5-5
voyage.api-key=${VOYAGE_API_KEY}
voyage.model=voyage-4-large
libreoffice.path=${LIBREOFFICE_PATH:C:/Program Files/LibreOffice/program/soffice.com}
duplicates.min-similarity=${DUPLICATES_MIN_SIMILARITY:0.85}
duplicates.min-share=${DUPLICATES_MIN_SHARE:0.80}